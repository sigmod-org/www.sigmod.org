# Builds the site and publishes it on GitHub Pages at https://www.sigmod.org/ (custom domain, HTTPS enforced).
# PATH_PREFIX stays "/": the site is served from the domain root. Set it to "/<repo>/" only to serve from <owner>.github.io/<repo>/.
name: Publish on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
        env:
          PATH_PREFIX: /
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        # GitHub caps the deploy wait at 10 minutes. If its file sync is slow and the step times out,
        # re-run the failed job (gh run rerun <id> --failed); the build does not need to run again.
