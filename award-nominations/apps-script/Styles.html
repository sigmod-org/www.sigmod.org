<style>
/* Form styles, scoped to .nom so the same file can sit inside sigmod.org pages. */
.nom {
  --ink: #111827; --body: #374151; --muted: #6b7280; --line: #e5e7eb; --tint: #f3f6fb;
  --accent: #1f4fa3; --accent-soft: #e9effa; --bg: #fff; --field: #fff; --on-accent: #fff;
  --ok: #166534; --ok-soft: #e8f5ec; --warn: #9a3412; --warn-soft: #fdf1ea; --err: #b91c1c; --err-soft: #fdecec;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--body); font: 16px/1.6 var(--sans);
}
.nom *, .nom *::before, .nom *::after { box-sizing: border-box; }
.nom a { color: var(--accent); text-underline-offset: 3px; }
.nom h1, .nom h2 { color: var(--ink); line-height: 1.25; font-family: var(--sans); }
.nom h1 { font-size: 1.75rem; margin: 0 0 .35rem; letter-spacing: -.01em; font-weight: 700; }
.nom h2 { font-size: 1.15rem; margin: 0 0 .75rem; font-weight: 600; }
.nom p { margin: 0 0 .75rem; }
.nom .lead { color: var(--muted); margin: 0 0 1.5rem; }
.nom .kicker { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0 0 .4rem; }
.nom .meta { color: var(--muted); font-size: 14.5px; margin: 0 0 22px; }
.nom .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

.nom .card { border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin: 0 0 20px; background: var(--bg); }
.nom .note { background: var(--tint); border-radius: 8px; padding: 12px 16px; margin: 0 0 20px; font-size: 15px; }
.nom .note.warn { background: var(--warn-soft); color: var(--warn); }
.nom .note.ok { background: var(--ok-soft); color: var(--ok); }
.nom .note.err { background: var(--err-soft); color: var(--err); }
.nom .note p { margin: .25rem 0; }
.nom .confirm { border: 2px solid var(--accent); background: var(--accent-soft); }

.nom .awards { display: grid; gap: 14px; }
.nom .award { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; text-decoration: none; color: var(--body); }
.nom .award:hover { border-color: var(--accent); background: var(--accent-soft); }
.nom .award b { color: var(--ink); display: block; font-size: 1.05rem; }
.nom .award small { color: var(--muted); font-size: 14px; }

.nom .field { margin: 0 0 16px; }
.nom .field > label, .nom .lbl { display: block; font-weight: 600; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.nom .req { color: var(--err); margin-left: 2px; }
.nom .help { color: var(--muted); font-size: 13.5px; margin: 2px 0 6px; }
.nom input[type=text], .nom input[type=email], .nom input[type=url], .nom select, .nom textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 11px; margin: 0;
}
.nom textarea { resize: vertical; line-height: 1.5; }
.nom input:focus, .nom select:focus, .nom textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.nom .invalid input, .nom .invalid select, .nom .invalid textarea { border-color: var(--err); }
.nom .msg { color: var(--err); font-size: 13.5px; margin-top: 4px; }
.nom .count { font-size: 12.5px; color: var(--muted); text-align: right; margin-top: 2px; }
.nom .count.over { color: var(--err); font-weight: 600; }
.nom .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.nom .check, .nom .field > label.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 400; color: var(--body); }
.nom .check input { margin-top: 5px; width: 16px; height: 16px; flex: none; }

.nom .file { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.nom .file input[type=file] { font-size: 14px; max-width: 100%; }

.nom .endorser { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 2px; margin-bottom: 12px; }
.nom .endorser-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.nom .endorser-h b { color: var(--ink); font-size: 14.5px; }

.nom button, .nom .btn {
  font: inherit; font-weight: 600; font-size: 15px; border-radius: 7px; padding: 9px 18px; cursor: pointer; line-height: 1.4;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); text-decoration: none; display: inline-block;
}
.nom button.ghost { background: transparent; color: var(--accent); }
.nom button.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.nom button.danger { border-color: var(--err); color: var(--err); background: transparent; }
.nom button:disabled { opacity: .5; cursor: default; }
.nom .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.nom .progress { color: var(--muted); font-size: 14px; }

.nom .tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 0; }
.nom .tbl th, .nom .tbl td { text-align: left; padding: 9px 8px; border: 0; border-bottom: 1px solid var(--line); vertical-align: top; background: none; }
.nom .tbl th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; }
.nom .tbl td small { color: var(--muted); display: block; }
.nom .tbl .acts { white-space: nowrap; text-align: right; }
.nom .tbl .acts button + button { margin-left: 10px; }
.nom .badge { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--muted); }
.nom .badge.submitted, .nom .badge.active { background: var(--ok-soft); color: var(--ok); }
.nom .badge.declined, .nom .badge.withdrawn, .nom .badge.expired, .nom .badge.abandoned { background: var(--warn-soft); color: var(--warn); }
.nom .badge.invited, .nom .badge.unconfirmed { background: var(--accent-soft); color: var(--accent); }

.nom dl.kv { display: grid; grid-template-columns: 200px 1fr; gap: 10px 18px; margin: 0; font-size: 15px; }
.nom dl.kv dt { color: var(--muted); font-weight: 600; }
.nom dl.kv dd { margin: 0; white-space: pre-wrap; color: var(--ink); }
.nom .loading { color: var(--muted); padding: 40px 0; }

@media (max-width: 640px) {
  .nom h1 { font-size: 1.45rem; }
  .nom .grid2 { grid-template-columns: 1fr; }
  .nom dl.kv { grid-template-columns: 1fr; gap: 2px; }
  .nom dl.kv dd { margin-bottom: 10px; }
  .nom .card { padding: 16px; }
  .nom .tbl, .nom .tbl tbody, .nom .tbl tr, .nom .tbl td { display: block; width: 100%; }
  .nom .tbl thead { display: none; }
  .nom .tbl tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .nom .tbl td { border: 0; padding: 3px 0; }
  .nom .tbl .acts { text-align: left; }
}
</style>
